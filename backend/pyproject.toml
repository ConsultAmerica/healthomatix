[project]
name = "healthomatix-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

